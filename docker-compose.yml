version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: nexgenclass-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nexgenclass

  # NexGenClass Express + Socket.IO Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexgenclass-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/nexgenclass
      - JWT_SECRET=production_jwt_secret_change_in_real_deployment
      - CLIENT_URL=http://localhost:5173
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads

  # NexGenClass React + Vite Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexgenclass-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_uploads:
